name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets --all-features

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [rust-quality, backend-tests, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build image
        run: |
          docker compose config --quiet
          docker compose pull
          docker compose build --pull
          docker tag ghcr.io/mizaawa/zakoai-proxy-cli:latest zakoai-proxy:ci
      - name: Smoke test nonroot image and persistent setup
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name zakoai-ci --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --publish 127.0.0.1:1990:1990 \
            --volume zakoai-ci-data:/data zakoai-proxy:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:1990/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:1990/health \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl --fail --silent --show-error http://127.0.0.1:1990/api/bootstrap \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["initialized"] is False'
          curl --fail --silent --show-error http://127.0.0.1:1990/ | grep -F '<title>'
          curl --fail --silent --show-error http://127.0.0.1:1990/assets/third-party-licenses.txt \
            | grep -F 'SIL OPEN FONT LICENSE'
          test "$(docker exec zakoai-ci id -u)" = 10001
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:1990/v1/models)" = 401
          SMOKE_PASSWORD="$(openssl rand -hex 24)"
          curl --fail --silent --show-error http://127.0.0.1:1990/api/setup \
            --header 'Content-Type: application/json' --header 'X-Console-Path: /' \
            --data "{\"username\":\"ci-smoke\",\"password\":\"${SMOKE_PASSWORD}\"}" > /dev/null
          docker restart zakoai-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:1990/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:1990/api/bootstrap \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["initialized"] is True'
          docker exec zakoai-ci test -s /data/master.key
          docker exec zakoai-ci test -s /data/zako.db
      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker tag zakoai-proxy:ci "${image}:${GITHUB_SHA}"
          docker tag zakoai-proxy:ci "${image}:latest"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs zakoai-ci 2>&1 || true
          docker inspect zakoai-ci --format '{{json .State.Health}}' || true
          docker rm --force zakoai-ci || true
          docker volume rm zakoai-ci-data || true
